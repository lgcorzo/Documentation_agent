name: Validate OKF Bundle & Architecture Docs
on: [push, pull_request]
jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python & UV
        uses: astral-sh/setup-uv@v5

      - name: Install PyYAML
        run: uv pip install --system pyyaml

      - name: Run OKF Conformance Checker (Strict)
        run: uv run skills/validate/scripts/okf_validate.py ./openwiki --strict

      - name: Verify No Absolute Paths
        run: |
          if grep -rn '/mnt/\|/home/\|C:\\' openwiki/; then
            echo "::error::Absolute paths found in openwiki/ — use relative paths only"
            exit 1
          fi
          echo "✓ No absolute paths detected"

      - name: Verify Bridge Events Log Structure
        run: |
          if [ -f ".specify/bridge/bridge-events.jsonl" ]; then
            python3 -c "
          import json, sys
          errors = 0
          with open('.specify/bridge/bridge-events.jsonl') as f:
              for i, line in enumerate(f, 1):
                  try:
                      event = json.loads(line)
                      if 'event' not in event or 'timestamp' not in event:
                          print(f'Line {i}: Missing required fields')
                          errors += 1
                  except json.JSONDecodeError as e:
                      print(f'Line {i}: Invalid JSON — {e}')
                      errors += 1
          if errors:
              sys.exit(1)
          print('✓ Bridge events log is valid')
          "
          else
            echo "⚠ Bridge events log not found (skipping)"
          fi

      - name: Verify Constitution Completeness
        run: |
          if grep -q 'PRINCIPLE_\|SECTION_\|GOVERNANCE_RULES\|\[PROJECT_NAME\]' .specify/memory/constitution.md; then
            echo "::error::Constitution contains unfilled template placeholders"
            exit 1
          fi
          echo "✓ Constitution is fully populated"
