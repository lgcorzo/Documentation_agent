name: Validate OKF Bundle & Architecture Docs
on: [push, pull_request]
jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python & UV
        uses: astral-sh/setup-uv@v5
      - name: Run OKF Conformance Checker
        run: uv run skills/validate/scripts/okf_validate.py ./openwiki --strict
